<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Przeglądaj oferty samochodów z wybranych portali w jednym miejscu.">
  <meta name="color-scheme" content="light dark">
  <title>Oferty samochodów — CarOffers</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css?v=47">
</head>
<body>
  <a class="skip-link" href="#offers">Przejdź do ofert</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="CarOffers — strona główna">
      <img src="./assets/favicon.svg" width="42" height="42" alt="">
      <span>CarOffers</span>
    </a>
    <div class="header-actions">
      <span id="result-count" class="result-count" aria-live="polite">Wczytywanie ofert…</span>
      <button id="reload-data" class="button button-secondary" type="button">Odśwież dane</button>
      <button id="theme-toggle" class="button button-secondary" type="button" aria-label="Przełącz na jasny motyw" aria-pressed="true">☀</button>
    </div>
  </header>

  <main id="offers" class="page-shell">
    <section class="intro">
      <div>
        <h1>Oferty samochodów</h1>
      </div>
    </section>

    <section class="filter-section" aria-label="Filtrowanie ofert">
      <label class="search-label" for="search-input">Szukaj
        <input id="search-input" type="search" placeholder="Model, silnik, VIN, lokalizacja…" autocomplete="off">
      </label>
      <details class="filter-details">
        <summary class="filter-summary">Filtry ofert <span>Model, rocznik, cena i przebieg</span></summary>
        <div class="filter-controls">
          <label for="model-filter">Model
            <select id="model-filter"><option value="">Wszystkie modele</option></select>
          </label>
          <div class="range-filter" role="group" aria-labelledby="year-filter-label">
            <span id="year-filter-label" class="filter-label">Rok produkcji</span>
            <div class="range-inputs">
              <input id="year-min" type="number" min="1886" max="2100" step="1" placeholder="Od" aria-label="Rok produkcji od">
              <input id="year-max" type="number" min="1886" max="2100" step="1" placeholder="Do" aria-label="Rok produkcji do">
            </div>
          </div>
          <div class="range-filter" role="group" aria-labelledby="price-filter-label">
            <span id="price-filter-label" class="filter-label">Cena, zł</span>
            <div class="range-inputs">
              <input id="price-min" type="number" min="0" step="1000" placeholder="Od" aria-label="Cena od">
              <input id="price-max" type="number" min="0" step="1000" placeholder="Do" aria-label="Cena do">
            </div>
          </div>
          <div class="range-filter" role="group" aria-labelledby="mileage-filter-label">
            <span id="mileage-filter-label" class="filter-label">Przebieg, km</span>
            <div class="range-inputs">
              <input id="mileage-min" type="number" min="0" step="10000" placeholder="Od" aria-label="Przebieg od">
              <input id="mileage-max" type="number" min="0" step="10000" placeholder="Do" aria-label="Przebieg do">
            </div>
          </div>
        </div>
      </details>
    </section>

    <label class="sort-control" for="sort-filter">Sortuj
      <select id="sort-filter">
        <option value="newest">Ostatnio zaktualizowane</option>
        <option value="price-asc">Cena: od najniższej</option>
        <option value="price-desc">Cena: od najwyższej</option>
        <option value="year-desc">Rok: od najnowszego</option>
        <option value="mileage-asc">Przebieg: od najniższego</option>
      </select>
    </label>

    <p id="notice" class="notice" role="status" hidden></p>
    <section id="offer-list" class="offer-list" aria-label="Karty ofert"></section>
    <section id="model-empty-state" class="empty-state" hidden>
      <h2>Brak ofert spełniających filtr</h2>
      <p>Zmień zakresy lub wyczyść filtry, aby zobaczyć więcej ofert.</p>
      <button id="clear-filters" class="button button-secondary" type="button">Wyczyść filtry</button>
    </section>
  </main>

  <noscript>Ta strona wymaga JavaScript do wyświetlania ofert.</noscript>
  <script type="module" src="./app.js?v=45"></script>
</body>
</html>
